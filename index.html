<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heliotide</title>
  <meta name="description" content="Heliotide is a free iPhone and iPad app about space weather and the Earth around you.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #1c1c1e; --quiet: #5f5f65; --line: #e3e3e6; --link: #0b5fc4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121214; --text: #f2f2f4; --quiet: #a5a5ab; --line: #2f2f33; --link: #7ab8ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; overflow-wrap: break-word; }
    .page { max-width: 660px; margin: 0 auto; padding: 24px 20px 64px; }
    nav { display: flex; gap: 20px; }
    nav a, footer a { display: inline-block; padding: 8px 0; }
    h1 { font-size: 32px; line-height: 1.2; margin: 32px 0 8px; }
    h2 { font-size: 20px; line-height: 1.3; margin: 36px 0 8px; }
    p, ul { margin: 0 0 14px; }
    ul { padding-left: 22px; }
    li { margin-bottom: 8px; }
    a { color: var(--link); }
    .quiet { color: var(--quiet); }
    footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--quiet); }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1>Heliotide</h1>
      <p>A free app that shows what the Sun and the Earth are doing around you right now, from solar flares and northern lights to earthquakes, storms and the weather outside.</p>
    </main>
    <nav aria-label="Pages">
      <a href="support/">Support</a>
      <a href="privacy/">Privacy Policy</a>
    </nav>
  </div>
</body>
</html>
